# Baota / aaPanel: REPLACE your existing `location /api { ... }` with the blocks below (do not duplicate two /api locations).
# Check: `include .../extension/social-link-saver.../*.conf` — remove or fix any second `location` that catches `/api`.
#
# Use ^~ so static `root` / regex locations never steal `/api/metadata/...` or `/api/fb-share-resolve`.
#
# proxy_pass MUST be `http://127.0.0.1:PORT` with NO path after the port (no trailing `/` on the URL).
# If you use `proxy_pass http://127.0.0.1:3007/;` under `location /api/`, nginx strips `/api` and Node sees `/metadata/...` — we mount `/metadata` in Express for that case.

location ^~ /api {
    proxy_pass http://127.0.0.1:3007;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# If your panel strips /api and forwards /metadata/* to Node, this helps:
location ^~ /metadata/ {
    proxy_pass http://127.0.0.1:3007;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /fb-share-resolve {
    proxy_pass http://127.0.0.1:3007;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
