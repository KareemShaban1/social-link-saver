# Add these next to your site `root` (dist/) so new deploys are not stuck behind
# browser / CDN cache. Hashed assets can stay long-lived; HTML + SW must not.

# Never cache the service worker — otherwise clients never learn about new builds.
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
}

location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
}

location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
}

# Always revalidate the shell so it points at new hashed CSS/JS after deploy.
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
}

# Optional: long cache for fingerprinted Vite assets (safe — filename changes each build).
