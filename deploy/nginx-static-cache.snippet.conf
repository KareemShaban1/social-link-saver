# Paste these blocks INTO your aaPanel Nginx site config.
# Place them BEFORE the `location ~* \.(js|css)` expires rule.
#
# Root cause of stale colors on mobile/normal tabs:
#   location ~ .*\.(js|css)?$ { expires 12h; }
# caches /sw.js for 12 hours, so the browser never loads the new service worker.

# Never cache the service worker
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    try_files $uri =404;
}

location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    try_files $uri =404;
}

location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    try_files $uri =404;
}

# Always revalidate the SPA shell (points at new hashed CSS/JS after deploy)
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
}

# Optional but recommended: long cache only for fingerprinted Vite assets
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}
